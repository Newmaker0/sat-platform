services:
  sat-postgres:
    image: postgres:16-alpine
    container_name: sat-postgres
    environment:
      POSTGRES_DB: satdb
      POSTGRES_USER: sat
      POSTGRES_PASSWORD: sat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sat -d satdb"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - sat-postgres-data:/var/lib/postgresql/data

  sat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sat-backend
    depends_on:
      sat-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://sat-postgres:5432/satdb
      DB_USERNAME: sat
      DB_PASSWORD: sat
      JPA_DDL_AUTO: update
      SAT_JWT_SECRET: change-this-jwt-secret-key-with-at-least-32-characters
    ports:
      - "8080:8080"

volumes:
  sat-postgres-data:
