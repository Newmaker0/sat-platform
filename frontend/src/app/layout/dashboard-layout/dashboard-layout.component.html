<div class="min-h-screen bg-slate-100 text-slate-900">
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white px-4 py-3 md:hidden">
    <div class="flex items-center justify-between">
      <h1 class="text-sm font-semibold uppercase tracking-[0.15em] text-slate-700">SAT Platform</h1>
      <button
        type="button"
        (click)="toggleSidebar()"
        class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700"
      >
        Menu
      </button>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-57px)] w-full md:min-h-screen">
    <div
      class="fixed inset-0 z-30 bg-slate-950/30 md:hidden"
      *ngIf="isSidebarOpen"
      (click)="closeSidebar()"
    ></div>

    <aside
      class="fixed inset-y-0 left-0 z-40 flex w-72 flex-col border-r border-slate-200 bg-white p-4 transition-transform md:static md:z-auto md:translate-x-0"
      [class.-translate-x-full]="!isSidebarOpen"
      [class.translate-x-0]="isSidebarOpen"
    >
      <div>
        <h2 class="text-base font-semibold text-slate-900">Painel</h2>
        <p class="mt-1 text-sm text-slate-500">Central de operações de campo</p>
      </div>

      <nav class="mt-6 grid gap-1.5">
        <a
          *ngFor="let link of links"
          [routerLink]="link.path"
          routerLinkActive="bg-slate-900 text-white hover:bg-slate-800"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-200"
          (click)="closeSidebar()"
        >
          {{ link.label }}
        </a>
      </nav>

      <div class="relative mt-auto border-t border-slate-200 pt-4" *ngIf="user$ | async as user" #userMenuContainer>
        <div
          *ngIf="isUserMenuOpen"
          class="absolute bottom-full left-0 right-0 z-20 mb-2 overflow-hidden rounded-xl border border-slate-700 bg-slate-950 text-slate-100 shadow-2xl"
        >
          <div class="flex items-center gap-3 border-b border-slate-800 px-3 py-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-700 text-xs font-semibold text-white">
              {{ user.username.charAt(0).toUpperCase() }}
            </div>
            <div class="min-w-0">
              <p class="truncate text-sm font-medium">{{ user.username }}</p>
              <p class="truncate text-xs text-slate-400">Usuário autenticado</p>
            </div>
          </div>

          <div class="grid gap-1 px-2 py-2">
            <button
              type="button"
              (click)="goToSettings()"
              class="rounded-md px-2 py-2 text-left text-sm text-slate-200 transition hover:bg-slate-800"
            >
              Conta
            </button>
            <button
              type="button"
              (click)="goToReports()"
              class="rounded-md px-2 py-2 text-left text-sm text-slate-200 transition hover:bg-slate-800"
            >
              Faturamento
            </button>
            <button
              type="button"
              (click)="goToSettings()"
              class="rounded-md px-2 py-2 text-left text-sm text-slate-200 transition hover:bg-slate-800"
            >
              Notificações
            </button>
          </div>

          <div class="border-t border-slate-800 px-2 py-2">
            <button
              type="button"
              (click)="logout()"
              class="w-full rounded-md px-2 py-2 text-left text-sm text-slate-100 transition hover:bg-slate-800"
            >
              Sair
            </button>
          </div>
        </div>

        <button
          type="button"
          (click)="toggleUserMenu($event)"
          [attr.aria-expanded]="isUserMenuOpen"
          class="mt-4 flex w-full items-center gap-3 rounded-lg border border-slate-300 bg-white px-3 py-2 text-left text-slate-900 transition hover:bg-slate-50"
        >
          <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-900 text-xs font-semibold text-white">
            {{ user.username.charAt(0).toUpperCase() }}
          </div>

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium">{{ user.username }}</p>
            <p class="truncate text-xs text-slate-500">Usuário autenticado</p>
          </div>

          <span class="text-slate-500" aria-hidden="true">
            <svg viewBox="0 0 20 20" class="h-5 w-5 fill-current">
              <path
                d="M10 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 7a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 7a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"
              />
            </svg>
          </span>
        </button>
      </div>
    </aside>

    <main class="w-full p-4 sm:p-6 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
