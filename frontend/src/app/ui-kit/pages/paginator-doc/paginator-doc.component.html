<div class="space-y-4">
  <header class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Paginação</h1>
    <p class="mt-2 text-sm text-slate-600">
      Exemplo de uso do `app-paginator` reutilizável de `shared/ui`.
    </p>
  </header>

  <article class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <header class="border-b border-slate-200 px-5 py-4">
      <h2 class="text-base font-semibold text-slate-900">Preview</h2>
      <p class="mt-1 text-sm text-slate-600">
        Estado atual: página {{ pageIndex + 1 }}, tamanho {{ pageSize }}, total {{ length }}.
      </p>
    </header>

    <div class="min-h-[12rem] p-4"></div>

    <app-paginator
      [shrink]="true"
      [length]="length"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [showFirstLastButtons]="true"
      ariaLabel="Paginação do catálogo UI"
      (pageChange)="onPageChange($event)"
    ></app-paginator>
  </article>
</div>
