<div class="space-y-4">
  <header class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Botões</h1>
    <p class="mt-2 text-sm text-slate-600">
      Variações usadas na aplicação para ações principais e secundárias.
    </p>
  </header>

  <section class="grid gap-4 xl:grid-cols-[1.1fr_1fr]">
    <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-base font-semibold text-slate-900">Preview</h2>
      <div
        class="mt-4 flex min-h-[10rem] items-center justify-center rounded-lg border border-dashed border-slate-300 bg-slate-50"
      >
        <button
          type="button"
          [disabled]="disabled"
          class="rounded-md border font-semibold transition"
          [ngClass]="getPreviewClasses()"
        >
          Confirmar ação
        </button>
      </div>
    </article>

    <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-base font-semibold text-slate-900">Controles</h2>

      <div class="mt-4">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Tom</p>
        <div class="mt-2 flex flex-wrap gap-2">
          <button
            type="button"
            *ngFor="let tone of tones"
            (click)="setTone(tone)"
            class="rounded-md border px-3 py-1.5 text-xs font-semibold transition"
            [ngClass]="
              selectedTone === tone
                ? 'border-slate-900 bg-slate-900 text-white'
                : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'
            "
          >
            {{ tone }}
          </button>
        </div>
      </div>

      <div class="mt-4">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Tamanho</p>
        <div class="mt-2 flex flex-wrap gap-2">
          <button
            type="button"
            *ngFor="let size of sizes"
            (click)="setSize(size)"
            class="rounded-md border px-3 py-1.5 text-xs font-semibold transition"
            [ngClass]="
              selectedSize === size
                ? 'border-slate-900 bg-slate-900 text-white'
                : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'
            "
          >
            {{ size }}
          </button>
        </div>
      </div>

      <label class="mt-4 flex items-center gap-2 text-sm font-medium text-slate-700">
        <input
          type="checkbox"
          class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-500"
          [checked]="disabled"
          (change)="toggleDisabled()"
        />
        Disabled
      </label>
    </article>
  </section>
</div>
