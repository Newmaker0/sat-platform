<div class="space-y-4">
  <header class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Estados assíncronos · Lista</h1>
    <p class="mt-2 text-sm text-slate-600">
      Simulação visual para validar estados assíncronos em bloco de lista.
    </p>

    <div class="mt-4 flex flex-wrap gap-2">
      <button
        type="button"
        *ngFor="let state of states"
        (click)="setState(state)"
        class="rounded-md border px-3 py-1.5 text-xs font-semibold transition"
        [ngClass]="
          currentState === state
            ? 'border-slate-900 bg-slate-900 text-white'
            : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'
        "
      >
        {{ state }}
      </button>
    </div>
  </header>

  <article class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <h2 class="text-base font-semibold text-slate-900">Bloco de lista</h2>
    <p class="mt-1 text-sm text-slate-600">Exemplo de card com altura estável.</p>

    <div class="mt-4 min-h-[16rem]">
      <app-async-state
        [status]="currentState"
        [loadingTemplate]="listLoadingTpl"
        [successTemplate]="listSuccessTpl"
        errorMessage="Não foi possível carregar a lista."
        emptyMessage="Nenhum item encontrado."
        [panelMinHeightClass]="'min-h-[16rem]'"
      ></app-async-state>

      <ng-template #listLoadingTpl>
        <ul class="space-y-2">
          <li
            *ngFor="let row of [1, 2, 3, 4]"
            class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-3 animate-pulse"
          >
            <div class="h-4 w-36 rounded bg-slate-200"></div>
            <div class="mt-2 h-3.5 w-28 rounded bg-slate-200"></div>
            <div class="mt-2 h-3.5 w-24 rounded bg-slate-200"></div>
          </li>
        </ul>
      </ng-template>

      <ng-template #listSuccessTpl>
        <ul class="space-y-2">
          <li
            *ngFor="let item of items; trackBy: trackById"
            class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-3"
          >
            <p class="text-sm font-semibold text-slate-900">{{ item.nome }}</p>
            <p class="mt-1 text-sm text-slate-600">{{ item.local }}</p>
            <p class="mt-1 text-sm font-medium text-slate-800">{{ item.quantidade }}</p>
          </li>
        </ul>
      </ng-template>
    </div>
  </article>
</div>
