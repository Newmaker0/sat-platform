<div class="space-y-4">
  <header class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Estados assíncronos · Tabela</h1>
    <p class="mt-2 text-sm text-slate-600">
      Simulação visual para validar estados assíncronos em bloco tabular.
    </p>

    <div class="mt-4 flex flex-wrap gap-2">
      <button
        type="button"
        *ngFor="let state of states"
        (click)="setState(state)"
        class="rounded-md border px-3 py-1.5 text-xs font-semibold transition"
        [ngClass]="
          currentState === state
            ? 'border-slate-900 bg-slate-900 text-white'
            : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-100'
        "
      >
        {{ state }}
      </button>
    </div>
  </header>

  <article class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <header class="border-b border-slate-200 px-5 py-4">
      <h2 class="text-base font-semibold text-slate-900">Bloco de tabela</h2>
      <p class="mt-1 text-sm text-slate-600">Estrutura de tabela com altura estável.</p>
    </header>

    <div class="min-h-[16rem] p-4">
      <app-async-state
        [status]="currentState"
        [loadingTemplate]="tableLoadingTpl"
        [successTemplate]="tableSuccessTpl"
        errorMessage="Falha ao carregar a tabela."
        emptyMessage="Sem linhas para exibir."
        [panelMinHeightClass]="'min-h-[16rem]'"
      ></app-async-state>

      <ng-template #tableLoadingTpl>
        <div class="space-y-3">
          <div *ngFor="let row of [1, 2, 3, 4, 5]" class="animate-pulse">
            <div class="grid grid-cols-4 gap-3">
              <div class="h-4 rounded bg-slate-200"></div>
              <div class="h-4 rounded bg-slate-200"></div>
              <div class="h-4 rounded bg-slate-200"></div>
              <div class="h-4 rounded bg-slate-200"></div>
            </div>
          </div>
        </div>
      </ng-template>

      <ng-template #tableSuccessTpl>
        <div class="overflow-hidden rounded-lg border border-slate-200">
          <table class="w-full text-left">
            <thead class="border-b border-slate-200 bg-slate-50">
              <tr>
                <th class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
                  Item
                </th>
                <th class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
                  Local
                </th>
                <th class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
                  Qtd.
                </th>
                <th class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-slate-500">
                  Status
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <tr *ngFor="let item of items; trackBy: trackById">
                <td class="px-3 py-2 text-sm font-medium text-slate-900">{{ item.nome }}</td>
                <td class="px-3 py-2 text-sm text-slate-700">{{ item.local }}</td>
                <td class="px-3 py-2 text-sm text-slate-800">{{ item.quantidade }}</td>
                <td class="px-3 py-2">
                  <span
                    class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold"
                    [ngClass]="
                      item.status === 'Crítico'
                        ? 'bg-rose-100 text-rose-700'
                        : 'bg-emerald-100 text-emerald-700'
                    "
                  >
                    {{ item.status }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-template>
    </div>
  </article>
</div>
