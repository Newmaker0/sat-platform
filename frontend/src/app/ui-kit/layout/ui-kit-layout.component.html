<section class="min-h-screen bg-slate-100">
  <div class="flex min-h-screen">
    <aside class="hidden w-64 shrink-0 border-r border-slate-200 bg-white p-4 md:flex md:flex-col">
      <div>
        <p class="text-[0.68rem] font-semibold uppercase tracking-[0.14em] text-slate-500">
          Development
        </p>
        <h1 class="mt-1 text-xl font-semibold text-slate-900">UI Kit</h1>
      </div>

      <div class="mt-5 space-y-5">
        <nav *ngFor="let section of navSections" class="space-y-1.5">
          <p class="px-3 text-[0.68rem] font-semibold uppercase tracking-[0.1em] text-slate-500">
            {{ section.title }}
          </p>
          <a
            *ngFor="let item of section.items"
            [routerLink]="item.path"
            routerLinkActive="border-slate-900 bg-slate-900 text-white"
            [routerLinkActiveOptions]="{ exact: item.path === '/ui-kit' }"
            class="block rounded-md border border-transparent px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
          >
            {{ item.label }}
          </a>
        </nav>
      </div>

      <p class="mt-auto text-xs text-slate-500">Dev-only. Excluído do build de produção.</p>
    </aside>

    <div class="flex-1 space-y-4 p-4 md:p-6">
      <header class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm md:hidden">
        <p class="text-[0.68rem] font-semibold uppercase tracking-[0.14em] text-slate-500">
          Development
        </p>
        <h1 class="mt-1 text-lg font-semibold text-slate-900">UI Kit</h1>
        <div class="mt-3 space-y-2">
          <div *ngFor="let section of navSections" class="space-y-1.5">
            <p class="text-[0.68rem] font-semibold uppercase tracking-[0.1em] text-slate-500">
              {{ section.title }}
            </p>
            <div class="flex gap-2 overflow-x-auto pb-1">
              <a
                *ngFor="let item of section.items"
                [routerLink]="item.path"
                routerLinkActive="border-slate-900 bg-slate-900 text-white"
                [routerLinkActiveOptions]="{ exact: item.path === '/ui-kit' }"
                class="whitespace-nowrap rounded-md border border-slate-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-700"
              >
                {{ item.label }}
              </a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</section>
