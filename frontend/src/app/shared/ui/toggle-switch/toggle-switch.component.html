<button
  type="button"
  [attr.aria-pressed]="checked"
  [attr.aria-label]="ariaLabel"
  [disabled]="disabled"
  class="relative rounded-full border-0 p-0.5 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:ring-offset-2 focus-visible:ring-offset-white"
  [ngClass]="trackClasses"
  (click)="onToggle()"
>
  <span
    class="absolute left-0.5 top-0.5 rounded-full bg-white shadow transition-transform"
    [ngClass]="thumbClasses"
  ></span>
</button>
