<section class="min-h-screen bg-white md:grid md:grid-cols-2">
  <aside
    class="relative hidden overflow-hidden bg-slate-950 p-10 text-slate-200 md:flex md:flex-col md:justify-between"
  >
    <div
      class="absolute inset-0 opacity-0 transition-opacity duration-700 ease-out"
      [class.opacity-0]="!shouldRenderOrbitalScene"
      [class.opacity-100]="shouldRenderOrbitalScene"
    >
      <sat-orbital-scene *ngIf="shouldRenderOrbitalScene" aria-hidden="true"></sat-orbital-scene>
    </div>
    <p class="sat-type-eyebrow text-slate-400">SAT Platform</p>
    <div class="relative z-10 max-w-xs">
      <h2 class="text-2xl font-semibold tracking-tight text-slate-100">
        Orbital Inventory Console
      </h2>
      <p class="mt-2 text-sm font-medium text-slate-400">
        Sincronização resiliente de peças críticas para operações em órbita.
      </p>
    </div>
  </aside>

  <div class="flex min-h-screen items-center p-6 sm:p-10">
    <div class="mx-auto w-full max-w-sm">
      <p class="sat-type-eyebrow mb-2 md:hidden">SAT Platform</p>
      <h1 class="sat-type-page-title">Entrar</h1>
      <p class="sat-type-page-subtitle mt-2">
        Acesse sua conta para abrir o painel administrativo.
      </p>

      <form class="mt-6 space-y-4" (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
        <div class="space-y-1.5">
          <label class="sat-type-label" for="username">Usuário</label>
          <input
            class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            id="username"
            name="username"
            [(ngModel)]="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Pedro"
          />
        </div>

        <div class="space-y-1.5">
          <label class="sat-type-label" for="password">Senha</label>
          <input
            class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
            id="password"
            name="password"
            [(ngModel)]="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          />
        </div>

        <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

        <button
          class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-1"
          type="submit"
          [disabled]="isSubmitting"
          [class.cursor-not-allowed]="isSubmitting"
          [class.opacity-70]="isSubmitting"
        >
          {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>
  </div>
</section>
