<section>
  <app-page-header
    title="Relatórios"
    subtitle="Acompanhe os relatórios operacionais com paginação e status."
  ></app-page-header>

  <div
    class="sat-reports-table mt-5 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
  >
    <div class="hidden overflow-x-auto md:block">
      <table mat-table [dataSource]="pagedReports" class="sat-reports-data-table w-full">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Relatório</th>
          <td mat-cell *matCellDef="let row">
            <span class="sat-cell-ellipsis font-medium" [title]="row.nome">{{ row.nome }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="categoria">
          <th mat-header-cell *matHeaderCellDef>Categoria</th>
          <td mat-cell *matCellDef="let row">
            <span class="sat-cell-ellipsis" [title]="row.categoria">{{ row.categoria }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="atualizadoEm">
          <th mat-header-cell *matHeaderCellDef>Atualizado em</th>
          <td mat-cell *matCellDef="let row">
            <span class="sat-cell-ellipsis" [title]="row.atualizadoEm">{{ row.atualizadoEm }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span
              class="sat-status-pill inline-flex rounded-full px-2 py-1 text-xs font-medium"
              [ngClass]="getStatusClasses(row.status)"
            >
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="divide-y divide-slate-200 p-2 md:hidden">
      <article *ngFor="let row of pagedReports; trackBy: trackByReportId" class="px-2 py-3">
        <div class="flex items-start justify-between gap-3">
          <h3 class="truncate text-[0.95rem] font-semibold leading-6 text-slate-900">
            {{ row.nome }}
          </h3>
          <span
            class="sat-status-pill inline-flex shrink-0 rounded-full px-2 py-1 text-xs font-medium"
            [ngClass]="getStatusClasses(row.status)"
          >
            {{ row.status }}
          </span>
        </div>

        <dl class="mt-2.5 grid gap-2 text-[0.95rem]">
          <div class="flex items-center justify-between gap-4">
            <dt class="sat-type-body-muted">Categoria</dt>
            <dd class="truncate text-[0.95rem] font-medium text-slate-800">{{ row.categoria }}</dd>
          </div>
          <div class="flex items-center justify-between gap-4">
            <dt class="sat-type-body-muted">Atualizado em</dt>
            <dd class="truncate text-[0.95rem] font-medium text-slate-800">
              {{ row.atualizadoEm }}
            </dd>
          </div>
        </dl>
      </article>
    </div>

    <mat-paginator
      [length]="totalReports"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons
      aria-label="Paginação dos relatórios"
    ></mat-paginator>
  </div>
</section>
