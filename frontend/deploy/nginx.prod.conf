server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://sat-backend-ig4xp.ondigitalocean.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host sat-backend-ig4xp.ondigitalocean.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass https://sat-backend-ig4xp.ondigitalocean.app/actuator/;
        proxy_ssl_server_name on;
        proxy_set_header Host sat-backend-ig4xp.ondigitalocean.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
