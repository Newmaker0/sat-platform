name: Build Android APK and Upload to DO Spaces

on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/dev-digital-ocean-mobile-apk-upload.yml"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew :app:assembleDebug

      - name: Configure AWS credentials for DigitalOcean Spaces
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DIGITAL_OCEAN_SPACES_KEY }}
          aws-secret-access-key: ${{ secrets.DIGITAL_OCEAN_SPACES_SECRET }}
          aws-region: us-east-1

      - name: Upload APK to DigitalOcean Spaces
        env:
          SPACES_BUCKET: ${{ secrets.DIGITAL_OCEAN_SPACES_BUCKET }}
          SPACES_REGION: ${{ secrets.DIGITAL_OCEAN_SPACES_REGION }}
        run: |
          APK_PATH="mobile/app/build/outputs/apk/debug/app-debug.apk"
          DEST_PATH="mobile/${{ github.ref_name }}/${{ github.sha }}/sat-mobile-debug.apk"

          aws s3 cp "$APK_PATH" "s3://$SPACES_BUCKET/$DEST_PATH" \
            --endpoint-url "https://$SPACES_REGION.digitaloceanspaces.com" \
            --acl public-read

          echo "APK_URL=https://$SPACES_BUCKET.$SPACES_REGION.digitaloceanspaces.com/$DEST_PATH" >> $GITHUB_ENV

      - name: Publish APK URL in job summary
        run: |
          echo "## APK publicado" >> $GITHUB_STEP_SUMMARY
          echo "URL: $APK_URL" >> $GITHUB_STEP_SUMMARY
