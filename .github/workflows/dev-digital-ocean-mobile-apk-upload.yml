name: Build Android APK Artifact

on:
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/dev-digital-ocean-mobile-apk-upload.yml"

jobs:
  build-and-publish-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sat-mobile-debug-apk-${{ github.sha }}
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish download info in job summary
        run: |
          echo "## APK gerado" >> $GITHUB_STEP_SUMMARY
          echo "Arquivo: \`sat-mobile-debug-apk-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Baixe em: **Actions > este workflow > Artifacts**" >> $GITHUB_STEP_SUMMARY
